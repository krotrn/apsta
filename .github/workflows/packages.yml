name: Packages

# Builds the Arch and Debian/Ubuntu packages and checks that they install.
# Runs on pull requests and main, and is called by release.yml, which
# publishes the artifacts built here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  arch:
    name: Build Arch package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: archlinux:base-devel
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed git pacman-contrib \
            python python-build python-installer python-setuptools python-wheel python-jeepney \
            networkmanager iw iproute2 usbutils pciutils
          useradd -m builder

      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        run: |
          chown -R builder "$GITHUB_WORKSPACE"
          mode=local
          if [[ $GITHUB_REF == refs/tags/v* ]]; then mode=release; fi
          sudo -u builder --preserve-env=GITHUB_REF_NAME packaging/arch/ci-build.sh "$mode"

      - name: Install and smoke test
        run: |
          pacman -U --noconfirm packaging/arch/out/*.pkg.tar.zst
          apsta --version
          apsta completion bash > /dev/null
          test -f /usr/lib/systemd/system/apsta.service
          test -f /usr/share/polkit-1/actions/com.github.apsta.policy
          test -f /usr/share/icons/hicolor/scalable/apps/com.github.apsta.Gtk.svg

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: arch-package
          include-hidden-files: true
          if-no-files-found: error
          path: |
            packaging/arch/out/*.pkg.tar.zst
            packaging/arch/out/PKGBUILD
            packaging/arch/out/apsta.install
            packaging/arch/out/.SRCINFO

  deb:
    name: Build Debian/Ubuntu package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Built on the oldest LTS the PPA serves, so ${python3:Depends} stays installable there.
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential debhelper dh-python pybuild-plugin-pyproject \
            python3-all python3-setuptools python3-wheel devscripts lintian git ca-certificates

      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          packaging/deb/ci-build.sh binary

      - name: Lintian
        run: lintian --info --display-info --fail-on error packaging/deb/out/*.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: deb-package
          if-no-files-found: error
          path: packaging/deb/out/*.deb

  deb-install:
    name: Install .deb on ${{ matrix.image }}
    needs: deb
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "ubuntu:26.04", "debian:13"]
    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: deb-package
          path: deb

      - name: Install and smoke test
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./deb/*.deb
          apsta --version
          apsta completion bash > /dev/null
          apsta config --json > /dev/null
          test -f /usr/lib/systemd/system/apsta.service
          test -f /usr/share/polkit-1/actions/com.github.apsta.policy
          test -f /usr/share/icons/hicolor/scalable/apps/com.github.apsta.Gtk.svg
          python3 -c "import apsta_gui.backend, apsta_gui.helpers"
