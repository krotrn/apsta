name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Lint
        run: ruff check --output-format=github .

      - name: Formatting
        run: ruff format --check .

      - name: Shell scripts
        run: |
          shellcheck -s sh apsta_cli/data/apsta-sleep apsta_cli/data/apsta.runit
          shellcheck install.sh packaging/arch/ci-build.sh packaging/deb/ci-build.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install ".[dev]"

      # Unit tests mock every system call; integration tests drive the real CLI
      # against a simulated network stack (tests/integration/fakeworld.py).
      # Neither needs root or WiFi hardware.
      - name: Unit + integration tests with coverage
        run: |
          coverage run -m unittest discover -s tests -t . -v
          coverage report
          coverage xml

      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Coverage (Python ${{ matrix.python-version }})'
            echo '```'
            coverage report --skip-covered
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build sdist + wheel
        run: |
          python -m pip install build
          python -m build

      - name: Wheel ships the service files and entry points
        run: |
          python -m pip install dist/*.whl
          apsta --version
          apsta completion bash > /dev/null
          python - <<'PY'
          import apsta_cli, pathlib
          data = pathlib.Path(apsta_cli.__file__).parent / "data"
          for name in ("apsta.service", "apsta-sleep", "apsta.openrc", "apsta.runit", "com.github.apsta.policy"):
              assert (data / name).is_file(), name
          PY
