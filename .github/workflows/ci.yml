name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Lint
        run: ruff check --output-format=github .

      - name: Formatting
        run: ruff format --check .

      - name: Shell scripts
        run: |
          shellcheck -s sh apsta_cli/data/apsta-sleep apsta_cli/data/apsta.runit
          shellcheck install.sh packaging/arch/ci-build.sh packaging/deb/ci-build.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade "pip>=25.1" && python -m pip install -e . --group dev

      # Unit tests mock every system call; integration tests drive the real CLI
      # against a simulated network stack (tests/integration/fakeworld.py).
      # Neither needs root or WiFi hardware.
      - name: Unit + integration tests with coverage
        run: |
          coverage run -m unittest discover -s tests -t . -v
          coverage report
          coverage xml

      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Coverage (Python ${{ matrix.python-version }})'
            echo '```'
            coverage report --skip-covered
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  # Build every GUI state on a headless Broadway display, on the oldest and
  # newest libadwaita we support, failing on exceptions and GTK criticals.
  gui:
    name: GUI on ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 22.04 (libadwaita 1.1)
            slug: ubuntu-22.04
            image: ubuntu:22.04
            install: >-
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
              python3 python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 libgtk-4-bin python3-qrcode python3-pil
              dbus adwaita-icon-theme librsvg2-common xvfb imagemagick
          - name: Debian 12 (libadwaita 1.2)
            slug: debian-12
            image: debian:12
            install: >-
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
              python3 python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 libgtk-4-bin python3-qrcode python3-pil
              dbus adwaita-icon-theme librsvg2-common
          - name: Ubuntu 24.04 (libadwaita 1.5)
            slug: ubuntu-24.04
            image: ubuntu:24.04
            install: >-
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
              python3 python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 libgtk-4-bin python3-qrcode python3-pil
              dbus adwaita-icon-theme librsvg2-common
          - name: Fedora (latest)
            slug: fedora
            image: fedora:latest
            install: >-
              dnf install -y python3 python3-gobject gobject-introspection gtk4 libadwaita python3-qrcode
              python3-pillow dbus-daemon dbus-tools adwaita-icon-theme /usr/bin/gtk4-broadwayd
          - name: Arch Linux (latest)
            slug: arch
            image: archlinux:latest
            install: >-
              pacman -Syu --noconfirm python python-gobject gtk4 libadwaita python-qrcode python-pillow
              dbus adwaita-icon-theme
    steps:
      - name: Install GTK and libadwaita
        run: ${{ matrix.install }}

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Smoke test
        run: G_DEBUG=fatal-criticals dbus-run-session -- python3 scripts/gui_smoke.py gui-screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gui-screenshots-${{ matrix.slug }}
          path: gui-screenshots/

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build sdist + wheel
        run: |
          python -m pip install build
          python -m build

      - name: Wheel ships the service files and entry points
        run: |
          python -m pip install dist/*.whl
          apsta --version
          apsta completion bash > /dev/null
          python - <<'PY'
          import apsta_cli, pathlib
          data = pathlib.Path(apsta_cli.__file__).parent / "data"
          for name in ("apsta.service", "apsta-sleep", "apsta.openrc", "apsta.runit", "com.github.apsta.policy"):
              assert (data / name).is_file(), name
          PY
