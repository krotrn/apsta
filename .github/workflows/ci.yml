name: CI

# Lint, tests, GUI on real distributions, and the Python package build.
# Runs on pull requests and main, and is called by release.yml so a release
# can only publish what passed exactly these checks.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # The "ci-" prefix keeps this distinct from release.yml's group when called from it.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format
        run: ruff format --check .

      - name: Shell scripts
        run: |
          shellcheck -s sh apsta_cli/data/apsta-sleep apsta_cli/data/apsta.runit
          shellcheck install.sh scripts/hardware_check.sh packaging/arch/ci-build.sh \
            packaging/arch/ci-repo.sh packaging/deb/ci-build.sh

      - name: Workflows (actionlint)
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
        experimental: [false]
        include:
          # Early warning for the next Python release; doesn't block merges.
          - python-version: "3.15"
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install
        run: |
          python -m pip install --upgrade "pip>=25.1"
          python -m pip install -e . --group dev

      # Unit tests mock every system call; integration tests drive the real CLI
      # against a simulated network stack (tests/integration/fakeworld.py).
      # Neither needs root or WiFi hardware.
      - name: Unit + integration tests with coverage
        run: |
          coverage run -m unittest discover -s tests -t . -v
          coverage report
          coverage xml

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Coverage (Python ${{ matrix.python-version }})"
            echo '```'
            coverage report --skip-covered
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  # Build every GUI state on a headless display, on the oldest and newest
  # libadwaita we support, failing on exceptions and GTK criticals.
  gui:
    name: GUI on ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 22.04 (libadwaita 1.1)
            slug: ubuntu-22.04
            image: ubuntu:22.04
            install: >-
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
              python3 python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 libgtk-4-bin python3-qrcode python3-pil
              dbus adwaita-icon-theme librsvg2-common xvfb imagemagick
          - name: Debian 12 (libadwaita 1.2)
            slug: debian-12
            image: debian:12
            install: >-
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
              python3 python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 libgtk-4-bin python3-qrcode python3-pil
              dbus adwaita-icon-theme librsvg2-common
          - name: Ubuntu 24.04 (libadwaita 1.5)
            slug: ubuntu-24.04
            image: ubuntu:24.04
            install: >-
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
              python3 python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 libgtk-4-bin python3-qrcode python3-pil
              dbus adwaita-icon-theme librsvg2-common
          - name: Debian 13
            slug: debian-13
            image: debian:13
            install: >-
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
              python3 python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 libgtk-4-bin python3-qrcode python3-pil
              dbus adwaita-icon-theme librsvg2-common
          - name: Ubuntu 26.04
            slug: ubuntu-26.04
            image: ubuntu:26.04
            install: >-
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
              python3 python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 libgtk-4-bin python3-qrcode python3-pil
              dbus adwaita-icon-theme librsvg2-common
          - name: Fedora (latest)
            slug: fedora
            image: fedora:latest
            install: >-
              dnf install -y python3 python3-gobject gobject-introspection gtk4 libadwaita python3-qrcode
              python3-pillow dbus-daemon dbus-tools adwaita-icon-theme /usr/bin/gtk4-broadwayd
          - name: Arch Linux (latest)
            slug: arch
            image: archlinux:latest
            install: >-
              pacman -Syu --noconfirm python python-gobject gtk4 libadwaita python-qrcode python-pillow
              dbus adwaita-icon-theme
    steps:
      - name: Install GTK and libadwaita
        run: ${{ matrix.install }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Smoke test
        run: G_DEBUG=fatal-criticals dbus-run-session -- python3 scripts/gui_smoke.py gui-screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gui-screenshots-${{ matrix.slug }}
          path: gui-screenshots/
          if-no-files-found: ignore

  build:
    name: Python package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check --strict dist/*

      - name: Wheel installs and ships its data files
        run: |
          python -m pip install dist/*.whl
          apsta --version
          apsta completion bash > /dev/null
          python - <<'PY'
          import pathlib

          import apsta_cli
          import apsta_gui

          for package, names in (
              (apsta_cli, ["apsta.service", "apsta-sleep", "apsta.openrc", "apsta.runit", "com.github.apsta.policy"]),
              (apsta_gui, ["com.github.apsta.Gtk.desktop", "icons/hicolor/scalable/apps/com.github.apsta.Gtk.svg"]),
          ):
              data = pathlib.Path(package.__file__).parent / "data"
              for name in names:
                  assert (data / name).is_file(), name
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error
