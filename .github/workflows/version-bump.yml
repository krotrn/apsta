name: Version Bump

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version (example: 0.6.0)"
        required: true
        type: string

permissions:
  contents: write
  actions: write  # dispatch release.yml: tags pushed with GITHUB_TOKEN don't trigger workflows

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Bump version files
        run: python scripts/bump_version.py "$VERSION"

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/release_check.py "$VERSION"
          git add pyproject.toml apsta_cli/__init__.py packaging/arch/PKGBUILD debian/changelog CHANGELOG.md \
            apsta_gui/data/com.github.apsta.Gtk.metainfo.xml
          git commit -m "chore: bump version to $VERSION"
          git tag "v$VERSION"
          git push origin HEAD
          git push origin "v$VERSION"

      # Tags pushed with GITHUB_TOKEN don't trigger workflows, so start it explicitly.
      - name: Start the release pipeline
        run: gh workflow run release.yml --ref "v$VERSION"
