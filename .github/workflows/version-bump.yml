name: Version Bump

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version (example: 0.6.0)"
        required: true
        type: string

permissions:
  contents: write
  actions: write  # dispatch Release/Packages: tags pushed with GITHUB_TOKEN don't trigger workflows

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Bump version files
        run: python scripts/bump_version.py "$VERSION"

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml setup.py apsta_cli/common.py apsta_gui/helpers.py packaging/arch/PKGBUILD debian/changelog
          git commit -m "chore: bump version to $VERSION"
          git tag "v$VERSION"
          git push origin HEAD
          git push origin "v$VERSION"

      - name: Start release workflows
        run: |
          gh workflow run release.yml --ref "v$VERSION"
          gh workflow run packages.yml --ref "v$VERSION"
