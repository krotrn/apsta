# Keeps GitHub Actions and the Python dev tools on their latest versions.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: uv
    directory: /
    # Only refresh uv.lock. The minimums in pyproject.toml are what users'
    # distros must satisfy (e.g. Ubuntu 22.04 ships qrcode 7.3, and .deb builds
    # use the distro's setuptools), so they are raised by hand, not by a bot.
    versioning-strategy: lockfile-only
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: chore
