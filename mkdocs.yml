# Documentation website, published to GitHub Pages by .github/workflows/docs.yml.
# Build locally: scripts/build_site.py && mkdocs serve
site_name: apsta
site_url: https://krotrn.github.io/apsta/
site_description: >-
  Run a Wi-Fi hotspot on Linux while staying connected to Wi-Fi (AP+STA).
site_author: krotrn
repo_url: https://github.com/krotrn/apsta
repo_name: krotrn/apsta
edit_uri: ""
docs_dir: site-src
copyright: MIT licensed

theme:
  name: material
  custom_dir: docs-theme
  logo: assets/icon.svg
  favicon: assets/icon.svg
  features:
    - content.code.copy
    - navigation.instant
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      toggle:
        icon: material/weather-sunny
        name: Light mode

nav:
  - Home: index.md
  - How it works: how-it-works.md
  - 5 GHz Wi-Fi: 5ghz-wifi.md
  - Wi-Fi Direct: wifi-direct.md
  - JSON output: json-output.md
  - Architecture: ARCHITECTURE.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/krotrn/apsta
