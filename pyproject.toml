[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apsta"
version = "0.10.0"
description = "Run a Wi-Fi hotspot on Linux while staying connected to Wi-Fi (AP+STA)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{ name = "apsta contributors" }]
maintainers = [{ name = "krotrn" }]
keywords = [
  "wifi", "wi-fi", "hotspot", "wifi-hotspot", "access-point", "ap-sta", "ap+sta",
  "tethering", "wifi-direct", "p2p", "networkmanager", "nmcli", "hostapd", "dnsmasq",
  "linux", "gtk4", "libadwaita",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Environment :: X11 Applications :: Gnome",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Networking",
  "Topic :: System :: Networking :: Firewalls",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
# The GUI also needs PyGObject + GTK4 + libadwaita from the distribution.
gui = ["qrcode[pil]>=7.4"]  # distro packages: Ubuntu 22.04 ships 7.3
# Wi-Fi Direct hotspots on distributions whose wpa_supplicant has no control
# socket (Fedora, openSUSE, Alpine, Void): apsta talks to it over D-Bus.
p2p = ["jeepney>=0.7"]

# Development tools (PEP 735): `uv sync` installs them automatically;
# with pip >= 25.1: `pip install -e . --group dev`. Or just `make dev`.
[dependency-groups]
dev = ["coverage[toml]>=7.16", "ruff>=0.16", "jeepney>=0.7"]

[project.urls]
Homepage = "https://krotrn.github.io/apsta/"
Documentation = "https://krotrn.github.io/apsta/"
Source = "https://github.com/krotrn/apsta"
Issues = "https://github.com/krotrn/apsta/issues"
Changelog = "https://github.com/krotrn/apsta/blob/main/CHANGELOG.md"

[project.scripts]
apsta = "apsta_cli.cli:run"

[project.gui-scripts]
apsta-gtk = "apsta_gui.app:main"

[tool.setuptools.packages.find]
include = ["apsta_cli*", "apsta_gui*"]

[tool.setuptools.package-data]
apsta_cli = ["data/*"]
apsta_gui = ["data/*.desktop", "data/*.metainfo.xml", "data/icons/hicolor/*/apps/*.svg"]

# ── Tooling ───────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["packaging/*/out"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
  "UP006", "UP007", "UP035", "UP045",  # keep typing.List/Optional; switching is churn without benefit
  "SIM105",                   # explicit try/except/pass reads clearer here
  "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "SIM117"]

[tool.coverage.run]
branch = true
source = ["apsta_cli", "apsta_gui"]
# GTK widget code needs a display; scripts/gui_smoke.py exercises it in the CI "gui" job.
omit = [
  "*/__main__.py",
  "apsta_gui/app.py",
  "apsta_gui/compat.py",
  "apsta_gui/share.py",
  "apsta_gui/window.py",
  "apsta_gui/pages/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 94
exclude_also = [
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "pragma: no cover",
]
