# The last release of "apsta" on PyPI: an empty package that installs twinfi,
# so `pip install --upgrade apsta` moves existing installs to the new name.
# Published by hand as 0.13.0, after twinfi 0.13.0 was on PyPI. To publish a
# new version (bump `version` first), with a PyPI token scoped to apsta:
#
#   cd packaging/pypi-apsta && uv build && uvx twine upload dist/*
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "apsta"
version = "0.13.0"
description = "apsta is now twinfi: this package installs twinfi"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
maintainers = [{ name = "krotrn" }]
dependencies = ["twinfi>=0.13.0"]
classifiers = ["Development Status :: 7 - Inactive"]

[project.urls]
Homepage = "https://github.com/krotrn/twinfi"

[tool.setuptools]
py-modules = []
