  <circle cx="98" cy="30" r="13" fill="#2ec27e" stroke="#fff" stroke-width="3"/>
  <path d="M92 30h11m-4-5 5 5-5 5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
