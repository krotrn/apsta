<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a5fb4"/>
      <stop offset="1" stop-color="#174a8c"/>
    </linearGradient>
  </defs>
  <!-- base with a darker lower edge, in the style of GNOME app icons -->
  <rect x="12" y="16" width="104" height="100" rx="22" fill="url(#side)"/>
  <rect x="12" y="12" width="104" height="96" rx="22" fill="url(#bg)"/>
  <!-- broadcast arcs -->
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-width="9">
    <path d="M36 66a40 40 0 0 1 56 0"/>
    <path d="M48 78a23 23 0 0 1 32 0"/>
  </g>
  <path d="M28 54a56 56 0 0 1 72 0" fill="none" stroke="#fff" stroke-opacity=".55" stroke-linecap="round" stroke-width="9"/>
  <circle cx="64" cy="90" r="7.5" fill="#fff"/>
